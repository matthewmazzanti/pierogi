[package]
name = "pierogi"
version = "0.0.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "pierogi"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
# Safe wrappers for the console-terminal relay (src/tty.rs): AF_UNIX sockets,
# SCM_RIGHTS fd passing, poll, termios, signal masks. Keeps the fiddly cmsg
# parsing out of hand-rolled unsafe. (libc stays for the winsize ioctl and the
# async-signal-safe write in the SIGWINCH handler.)
nix = { version = "0.31", features = ["socket", "uio", "poll", "term", "signal", "fs", "event"] }
# The OCI runtime spec types we build in `oci.rs` and serialize to the JSON
# string libcrun's `load_from_memory` takes.
oci-spec = { version = "0.9", features = ["runtime"] }
# the typed pierogi Spec schema (serde derive) + JSON (also feeds libcrun's
# load_from_memory).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
# compiles the libcrun FFI shim (csrc/shim.c).
cc = "1"
