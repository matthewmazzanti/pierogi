[package]
name = "pierogi"
version = "0.0.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "pierogi"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
# Safe wrappers for the console-terminal relay (src/tty.rs): AF_UNIX sockets,
# SCM_RIGHTS fd passing, poll, termios, signal masks. Keeps the fiddly cmsg
# parsing out of hand-rolled unsafe. (libc stays for the winsize ioctl and the
# async-signal-safe write in the SIGWINCH handler.)
nix = { version = "0.31", features = ["socket", "uio", "poll", "term", "signal", "fs", "event",
# `unshare`/`setns` (sched) + `fork`/`waitpid` (process) + passwd lookup (user):
# the pause process that holds pierogi's persistent user+mount namespace.
                                     "sched", "process", "user"] }
# The OCI runtime spec types we build in `oci.rs` and serialize to the
# `config.json` the crun binary reads.
oci-spec = { version = "0.9", features = ["runtime"] }
# the typed pierogi Spec schema (serde derive) + JSON (also serialized to the
# OCI `config.json`).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
